[package]
name = "react-agent"
version = "1.0.0"
edition = "2021"
description = "A ReAct agent implementation in Rust"
authors = ["ScratchAgents Team"]

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# JSON serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI argument parsing
clap = { version = "4.4", features = ["derive"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Date/time
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.8"

# Math expression parsing
meval = "0.2"

# Colored terminal output
colored = "2.1"

[profile.release]
opt-level = 3
lto = true
