<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReAct Agent - TypeScript</title>
  <style>
    /* Reset and base styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background-color: #1a1a2e;
      color: #eee;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      background-color: #16213e;
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #0f3460;
    }

    header h1 {
      font-size: 1.25rem;
      color: #e94560;
    }

    .header-buttons {
      display: flex;
      gap: 0.5rem;
    }

    .icon-button {
      background: none;
      border: 1px solid #0f3460;
      color: #eee;
      padding: 0.5rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
      transition: background-color 0.2s;
    }

    .icon-button:hover {
      background-color: #0f3460;
    }

    /* Settings Panel */
    .settings-panel {
      position: absolute;
      top: 60px;
      right: 1rem;
      background-color: #16213e;
      border: 1px solid #0f3460;
      border-radius: 8px;
      padding: 1rem;
      z-index: 100;
      min-width: 300px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .settings-panel.hidden {
      display: none;
    }

    .settings-panel h3 {
      margin-bottom: 1rem;
      color: #e94560;
    }

    .setting-group {
      margin-bottom: 1rem;
    }

    .setting-group label {
      display: block;
      margin-bottom: 0.25rem;
      font-size: 0.875rem;
      color: #aaa;
    }

    .setting-group input,
    .setting-group select {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid #0f3460;
      border-radius: 4px;
      background-color: #1a1a2e;
      color: #eee;
      font-size: 0.875rem;
    }

    .setting-group input:focus,
    .setting-group select:focus {
      outline: none;
      border-color: #e94560;
    }

    .button-group {
      display: flex;
      gap: 0.5rem;
    }

    .btn {
      flex: 1;
      padding: 0.5rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.875rem;
      transition: opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn-primary {
      background-color: #e94560;
      color: white;
    }

    .btn-secondary {
      background-color: #0f3460;
      color: white;
    }

    /* Chat container */
    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Messages area */
    #chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .message {
      padding: 0.75rem 1rem;
      border-radius: 8px;
      max-width: 85%;
      line-height: 1.5;
    }

    .user-message {
      background-color: #0f3460;
      align-self: flex-end;
    }

    .assistant-message {
      background-color: #16213e;
      align-self: flex-start;
      border: 1px solid #0f3460;
    }

    .system-message {
      background-color: transparent;
      color: #888;
      font-size: 0.875rem;
      text-align: center;
      align-self: center;
    }

    .error-message {
      background-color: rgba(233, 69, 96, 0.2);
      border: 1px solid #e94560;
      color: #e94560;
      align-self: center;
    }

    .tool-message,
    .tool-result-message {
      background-color: rgba(15, 52, 96, 0.5);
      border-left: 3px solid #e94560;
      font-size: 0.875rem;
      align-self: flex-start;
    }

    .tool-label {
      display: block;
      color: #e94560;
      font-weight: bold;
      margin-bottom: 0.25rem;
    }

    .message code {
      background-color: rgba(0, 0, 0, 0.3);
      padding: 0.125rem 0.375rem;
      border-radius: 3px;
      font-family: 'Monaco', 'Menlo', monospace;
    }

    .message pre {
      background-color: rgba(0, 0, 0, 0.3);
      padding: 0.5rem;
      border-radius: 4px;
      overflow-x: auto;
      font-family: 'Monaco', 'Menlo', monospace;
      font-size: 0.8rem;
      margin-top: 0.5rem;
      white-space: pre-wrap;
    }

    .thinking-message {
      background-color: transparent;
      color: #888;
      align-self: flex-start;
    }

    .thinking-dots span {
      animation: blink 1.4s infinite both;
    }

    .thinking-dots span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .thinking-dots span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0; }
      40% { opacity: 1; }
    }

    /* Input area */
    .input-area {
      padding: 1rem;
      background-color: #16213e;
      border-top: 1px solid #0f3460;
      display: flex;
      gap: 0.5rem;
    }

    #chat-input {
      flex: 1;
      padding: 0.75rem 1rem;
      border: 1px solid #0f3460;
      border-radius: 8px;
      background-color: #1a1a2e;
      color: #eee;
      font-size: 1rem;
      resize: none;
    }

    #chat-input:focus {
      outline: none;
      border-color: #e94560;
    }

    #chat-input:disabled {
      opacity: 0.5;
    }

    #send-button {
      padding: 0.75rem 1.5rem;
      background-color: #e94560;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
      transition: opacity 0.2s;
    }

    #send-button:hover:not(:disabled) {
      opacity: 0.9;
    }

    #send-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .message {
        max-width: 95%;
      }

      .settings-panel {
        left: 1rem;
        right: 1rem;
        min-width: auto;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>ReAct Agent</h1>
    <div class="header-buttons">
      <button id="reset-button" class="icon-button" title="Clear conversation">Clear</button>
      <button id="settings-button" class="icon-button" title="Settings">Settings</button>
    </div>
  </header>

  <div id="settings-panel" class="settings-panel hidden">
    <h3>Settings</h3>

    <div class="setting-group">
      <label for="api-key-input">OpenRouter API Key</label>
      <input type="password" id="api-key-input" placeholder="sk-or-...">
    </div>

    <div class="button-group" style="margin-bottom: 1rem;">
      <button id="save-api-key" class="btn btn-primary">Save Key</button>
      <button id="clear-api-key" class="btn btn-secondary">Clear Key</button>
    </div>

    <div class="setting-group">
      <label for="model-select">Model</label>
      <select id="model-select">
        <!-- Populated by JavaScript -->
      </select>
    </div>

    <p style="font-size: 0.75rem; color: #888; margin-top: 1rem;">
      Get your API key at <a href="https://openrouter.ai" target="_blank" style="color: #e94560;">openrouter.ai</a>
    </p>
  </div>

  <div class="chat-container">
    <div id="chat-messages">
      <!-- Messages will be added here -->
    </div>

    <div class="input-area">
      <input
        type="text"
        id="chat-input"
        placeholder="Type your message..."
        autocomplete="off"
      >
      <button id="send-button">Send</button>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
